<script type="text/javascript">
console.log('window.found_devices', JSON.stringify(window.found_devices, false, 2));
console.log('window.selected_devices', JSON.stringify(window.selected_devices, false, 2));

var seenKeys = {};
var seenDeviceIds = {};
var devices = (window.selected_devices || []).filter(function(deviceKey){
  if (!deviceKey || seenKeys[deviceKey]) return false;
  seenKeys[deviceKey] = true;
  return true;
}).map(function(deviceKey){
  return window.found_devices[deviceKey];
}).filter(function(device){
  if (!device || !device.data || !device.data.id) return false;
  if (seenDeviceIds[device.data.id]) return false;
  seenDeviceIds[device.data.id] = true;
  return true;
});

var total = devices.length;
var done = 0;

if(total > 0) {
  devices.forEach(function(device){
    Homey.addDevice(device, function(err, result){
      done++;
      if( total === done ) {
        Homey.done();
      }
    })
  });
} else {
  Homey.done();
}
</script>
